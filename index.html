  var vistos = null;
  function stampsRow(x, total, tid) {
    var h = '';
    for (var i = 0; i < total; i++) {
      var k = x.res[i] || null;
      var key = tid + ':' + i + ':' + x.pid + ':' + k;
      var novo = vistos && k && k !== 'P' && !vistos[key];
      if (vistosNovo) vistosNovo[key] = 1;
      h += stamp(k, i + x.pos, novo);
    }
    return h;
  }
  var vistosNovo = null;

  function liveTop(s, vm) {
    var T = vm.T, cfg = vm.cfg, fase, dir = '';
    if (vm.phase === 'setup') fase = 'Antes do sorteio';
    else if (vm.phase === 'rounds') fase = 'Rodada ' + vm.last.n + ' de ' + cfg.rodadas;
    else if (vm.phase === 'gf') fase = 'Grande final';
    else fase = 'Resultado final';
    if (vm.phase === 'setup') {
      var n = T.players.filter(function (p) { return p.ativo !== false; }).length;
      dir = '<div class="txt"><b>' + n + '</b> jogadores<br>inscritos</div>';
    } else if (vm.phase === 'rounds') {
      var ms = vm.last.matches.filter(function (m) { return !m.bye; }).sort(function (a, b) { return a.mesa - b.mesa; });
      var segs = '<div class="seg">' + ms.map(function (m) { return '<i class="' + (m.w ? 'ok' : '') + '"></i>'; }).join('') + '</div>';
      if (vm.last.status === 'pareada') dir = segs + '<div class="txt"><b>Mesas sorteadas</b><br>começa em instantes</div>';
      else if (vm.last.status === 'em_jogo') dir = segs + '<div class="txt"><b>' + vm.progress.done + ' de ' + vm.progress.total + '</b><br>resultados</div>' + (vm.last.inicio ? '<div class="l-relogio num" data-since="' + vm.last.inicio + '">' + fmtClock(Date.now() - vm.last.inicio) + '</div>' : '');
      else dir = segs + '<div class="txt"><b>Rodada encerrada</b><br>' + (vm.last.n < cfg.rodadas ? 'próxima em instantes' : 'grande final a seguir') + '</div>';
    } else if (vm.phase === 'gf') {
      var fmtGf = T.gf.formato ? 'Melhor de ' + String(T.gf.formato).replace(/\D/g, '') : 'Grande final';
      dir = '<div class="txt"><b>' + fmtGf + '</b><br>' + (T.gf.status === 'em_jogo' ? 'no palco' : 'começa em instantes') + '</div>' +
        (T.gf.status === 'em_jogo' && T.gf.inicio ? '<div class="l-relogio num" data-since="' + T.gf.inicio + '">' + fmtClock(Date.now() - T.gf.inicio) + '</div>' : '');
    }
    return '<header class="l-top"><div class="l-ev"><b>' + esc(cfg.evento) + '</b>' + (cfg.subtitulo ? '<span>' + esc(cfg.subtitulo) + '</span>' : '') + '</div>' +
      '<div class="l-fase"><b>' + esc(T.nome) + '</b><span>' + esc(fase) + '</span>' + (T.simulacao ? '<i class="l-sim">simulação</i>' : '') + '</div><div class="l-prog">' + dir + '</div></header>';
  }

  function liveTabela(s, vm, opts) {
    opts = opts || {};
    var rk = vm.rank, cfg = vm.cfg, started = vm.started, T = vm.T;
    var n = rk.length;
    var corte = started && C.roundsDone(T, cfg) && !T.gf;
    var topo = started && C.roundsDone(T, cfg);
    var avail = (opts.altura || 816) - (corte ? 28 : 0);
    var rh = Math.max(34, Math.min(opts.rh || 49, Math.floor(avail / Math.max(n, 1))));
    var h = '<div class="l-tit"><span>Classificação</span><small>' + (started ? 'vitórias e derrotas' : 'ordem dos cards') + '</small></div><ol class="l-tabela">';
    rk.forEach(function (x, i) {
      if (corte && i === 2) h += '<li class="lr-corte">Os dois primeiros fazem a grande final</li>';
      var cls = 'lr' + (topo && i < 2 ? ' top' : '') + (x.final === 'campeao' ? ' campeao' : '') + (x.p.ativo === false ? ' fora' : '');
      h += '<li class="' + cls + '" style="height:' + rh + 'px"><span class="lr-pos num">' + (started ? x.pos : '–') + '</span><span class="lr-tag num">' + C.tagLabel(x.p.tag) + '</span>' +
        '<span class="lr-nick">' + esc(nickOf(x.p)) + '</span><span class="lr-st">' + stampsRow(x, cfg.rodadas, vm.t) + '</span>' +
        '<span class="lr-rec num">' + x.w + '<i>–</i>' + x.l + '</span></li>';
    });
    return h + '</ol>';
  }

  function duelHtml(d, big) {
    if (!d) return '<div class="l-espera">Nada por enquanto</div>';
    if (d.kind === 'msg') return '<div class="l-espera">' + esc(d.title) + (d.sub ? '<small>' + esc(d.sub) + '</small>' : '') + '</div>';
    if (d.kind === 'proj') {
      return d.rows.map(function (r) {
        if (r.w) return '<div class="l-proj"><span class="tg num">' + r.w.tag + '</span><span class="nk">' + esc(r.w.nick) + '<small>venceu a mesa ' + r.mesa + '</small></span></div>';
        return '<div class="l-proj"><span class="tg">?</span><span class="nk vago">' + esc(r.a.nick) + ' ou ' + esc(r.b.nick) + '<small>mesa ' + r.mesa + '</small></span></div>';
      }).join('');
    }
    var side = function (x, i) {
      var rc = d.gf ? '<span class="l-gf-pts num">' + x.pts + '</span>' : '<span class="rc num">' + (x.state === 'ganhou' ? stamp('V', i + 3, false) : '') + x.rec + '</span>';
      if (d.gf && x.state === 'ganhou') rc = '<span class="rc">' + stamp('V', 1) + '</span>' + rc;
      return '<div class="l-lado ' + x.state + '"' + (d.gf ? ' style="grid-template-columns:' + (big ? '100px' : '70px') + ' 1fr auto auto"' : '') + '><span class="tg num">' + x.tag + '</span><span class="nk">' + esc(x.nick) + '</span>' + rc + '</div>';
    };
    return side(d.sides[0], 0) + '<div class="l-x">×</div>' + side(d.sides[1], 1);
  }
  function stageCard(d, label, cls, big) {
    if (!d) return '';
    var right = d.kind === 'duel' ? (d.round + (d.where ? ', ' + d.where.toLowerCase() : '')) : (d.kind === 'proj' ? 'Grande final' : '');
    if (d.provisorio) right = 'Grande final, provisória';
    return '<div class="' + cls + '"><div class="l-palco-cab"><span>' + label + '</span><span>' + esc(right) + '</span></div>' + duelHtml(d, big) + '</div>';
  }
  function mesasList(s, vm, R, skipPalco) {
    var pm = vm.pm, cfg = vm.cfg;
    var ms = R.matches.filter(function (m) { return m.bye || !skipPalco || String(m.mesa) !== String(cfg.palco); })
      .sort(function (a, b) { return (a.bye ? 999 : a.mesa) - (b.bye ? 999 : b.mesa); });
    var h = '<div class="l-tit" style="margin-top:20px"><span>Rodada ' + R.n + (skipPalco ? ', demais mesas' : '') + '</span><small>' + (R.status === 'encerrada' ? 'resultado final' : '') + '</small></div><ul class="l-mesas" style="margin-top:0">';
    ms.forEach(function (m, i) {
      if (m.bye) { h += '<li class="folga"><span class="mn">F</span><span>' + esc(nickOf(pm[m.a])) + ' folga e leva a vitória</span></li>'; return; }
      var c = function (pid) {
        var k = m.w ? (m.w === pid ? 'w' : 'l') : '';
        return '<span class="ma ' + k + '">' + (k === 'w' ? stamp('V', i) : '') + '<span>' + esc(nickOf(pm[pid])) + '</span></span>';
      };
      h += '<li><span class="mn num">' + m.mesa + '</span>' + c(m.a) + '<span class="mx">×</span>' + c(m.b) + '</li>';
    });
    return h + '</ul>';
  }

  function liveCompleto(s, vm) {
    var T = vm.T, cfg = vm.cfg, left, right = '';
    if (vm.phase === 'setup') {
      var ps = T.players.filter(function (p) { return p.ativo !== false; }).sort(function (a, b) { return (Number(C.tagDigits(a.tag)) || 999) - (Number(C.tagDigits(b.tag)) || 999); });
      left = '<div class="l-tit"><span>Inscritos</span><small>' + ps.length + ' jogadores</small></div><ul class="l-inscritos">' +
        ps.map(function (p) {
          var rh = Math.min(96, Math.floor(812 / Math.max(1, Math.ceil(ps.length / 2))));
          return '<li style="height:' + rh + 'px"><span class="tg num">' + C.tagLabel(p.tag) + '</span><span class="nk"' + (rh < 70 ? ' style="font-size:36px"' : '') + '>' + esc(nickOf(p)) + '</span></li>';
        }).join('') + '</ul>';
      if (!ps.length) left += '<p class="l-formato">A lista sai depois do check-in.</p>';
      right = '<div class="l-palco"><div class="l-palco-cab"><span>Como funciona</span></div>' +
        '<p class="l-formato">' + cfg.rodadas + ' rodadas no suíço: todo mundo joga todas, sempre contra alguém com a mesma campanha.</p>' +
        '<p class="l-formato">Os dois melhores fazem a grande final no palco.</p></div>' +
        stageCard(stageData(s, vm, vm.next), 'Próximo no palco', 'l-prox');
      return '<div class="l-caixa">' + left + '</div><div class="l-caixa">' + right + '</div>';
    }
    left = liveTabela(s, vm);
    if (vm.phase === 'fim') {
      var g = T.gf, pm = vm.pm, W = pm[g.w], L = pm[g.w === g.a ? g.b : g.a];
      var pw = g.w === g.a ? g.pa : g.pb, pl = g.w === g.a ? g.pb : g.pa;
      right = '<div class="l-campeao"><div class="cab-c">Campeão do ' + esc(T.nome) + '</div><div class="nome">' + stamp('V', 2) + '<b>' + esc(nickOf(W)) + '</b></div>' +
        '<p>' + C.tagLabel(W && W.tag) + '. Venceu <b>' + esc(nickOf(L)) + '</b> por ' + pw + ' a ' + pl + ' na grande final.</p></div>' +
        stageCard(stageData(s, vm, vm.next) || stageData(s, vm, { kind: 'gf', gf: g }), vm.next ? 'Próximo no palco' : 'Grande final', 'l-prox');
      return '<div class="l-caixa">' + left + '</div><div class="l-caixa">' + right + '</div>';
    }
    var now = stageData(s, vm, vm.now), next = stageData(s, vm, vm.next);
    if (now) right += stageCard(now, vm.now.kind === 'gf' ? 'Grande final' : (now.done ? 'Último no palco' : 'No palco agora'), 'l-palco');
    if (next) right += stageCard(next, vm.next.kind === 'gf' ? 'Grande final' : 'Próximo no palco', now ? 'l-prox' : 'l-palco');
    if (vm.last) right += mesasList(s, vm, vm.last, vm.phase === 'rounds');
    return '<div class="l-caixa">' + left + '</div><div class="l-caixa">' + right + '</div>';
  }

  function liveCena(s, vm, cena) {
    if (cena === 'tabela') {
      if (vm.phase === 'setup') return liveCompleto(s, vm);
      return '<div class="l-caixa">' + liveTabela(s, vm, { rh: 52, altura: 830 }) + '</div>';
    }
    if (cena === 'palco') {
      var h = '';
      if (vm.phase === 'fim') {
        var g = vm.T.gf, W = vm.pm[g.w], L = vm.pm[g.w === g.a ? g.b : g.a];
        h = '<div class="l-campeao"><div class="cab-c">Campeão do ' + esc(vm.T.nome) + '</div><div class="nome">' + stamp('V', 2) + '<b>' + esc(nickOf(W)) + '</b></div><p>Venceu <b>' + esc(nickOf(L)) + '</b> por ' + (g.w === g.a ? g.pa + ' a ' + g.pb : g.pb + ' a ' + g.pa) + ' na grande final.</p></div>';
      } else {
        var now = stageData(s, vm, vm.now), next = stageData(s, vm, vm.next);
        var main = now && !now.done ? now : (next || now);
        var lbl = main === now ? (vm.now.kind === 'gf' ? 'Grande final' : (now.done ? 'Último no palco' : 'No palco agora')) : (vm.next && vm.next.kind === 'gf' ? 'Grande final' : 'Próximo no palco');
        h = stageCard(main, lbl, 'l-palco', true);
        if (main === now && next) h += stageCard(next, 'Depois', 'l-prox');
      }
      return '<div class="l-caixa">' + h + '</div>';
    }
    if (cena === 'rodada') {
      if (!vm.last) return liveCompleto(s, vm);
      var R = vm.last, pm = vm.pm, cfg = vm.cfg;
      var ms = R.matches.filter(function (m) { return !m.bye; }).sort(function (a, b) { return a.mesa - b.mesa; });
      var bye = R.matches.filter(function (m) { return m.bye; })[0];
      var g = ms.map(function (m, i) {
        var pal = String(m.mesa) === String(cfg.palco);
        var j = function (pid, k) {
          var c = m.w ? (m.w === pid ? 'w' : 'l') : '';
          return '<div class="gm-j ' + c + '"><span class="tg num">' + C.tagLabel((pm[pid] || {}).tag) + '</span><span class="nk">' + esc(nickOf(pm[pid])) + '</span>' + (c === 'w' ? stamp('V', i + k) : '') + '</div>';
        };
        return '<div class="gm' + (pal ? ' palco' : '') + '"><div class="gm-cab"><b>Mesa ' + m.mesa + '</b>' + (pal ? '<span>Palco</span>' : '') + '</div>' + j(m.a, 0) + '<div class="gm-x">×</div>' + j(m.b, 1) + '</div>';
      }).join('');
      return '<div class="l-caixa"><div class="l-tit"><span>Rodada ' + R.n + '</span><small>' + (bye ? esc(nickOf(pm[bye.a])) + ' folga nesta rodada' : '') + '</small></div><div class="grade-mesas">' + g + '</div></div>';
    }
    return liveCompleto(s, vm);
  }

  function fitTela() {
    var tela = $('.tela');
    if (!tela) return;
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    tela.style.transform = 'scale(' + k + ')';
    tela.style.left = ((window.innerWidth - 1920 * k) / 2) + 'px';
    tela.style.top = ((window.innerHeight - 1080 * k) / 2) + 'px';
  }

  function renderLive() {
    var s = Store.cur;
    var tid = (Q.get('t') || '').toUpperCase();
    if (C.T_IDS.indexOf(tid) < 0) tid = s.ativo;
    var vm = C.viewModel(s, tid);
    var cena = (Q.get('cena') || 'completo').toLowerCase();
    vistosNovo = {};
    var body = liveCena(s, vm, cena);
    var tela = $('.tela');
    tela.className = 'tela cena-' + cena;
    tela.innerHTML = liveTop(s, vm) + '<div class="l-corpo">' + body + '</div>';
    vistos = vistosNovo;
    fitTela();
  }

  function bootLive() {
    document.body.classList.add('live');
    if ((Q.get('fundo') || '').indexOf('transp') === 0) document.body.classList.add('transparente');
    $('#app').innerHTML = '<div class="tela"></div>';
    window.addEventListener('resize', fitTela);
    if (Leitura.ativa()) {
      Store.listeners.push(renderLive);
      $('.tela').innerHTML = '<div class="l-aviso"><b>Conectando à planilha</b></div>';
      fitTela();
      Leitura.onTick = function () {
        if (!Store.cur && Leitura.erro) { $('.tela').innerHTML = '<div class="l-aviso"><b>Conectando à planilha</b>' + esc(Leitura.erro) + '</div>'; fitTela(); }
      };
      Leitura.start();
      return;
    }
    if (!Q.get('modo')) {
      $('.tela').innerHTML = '<div class="l-aviso"><b>Falta ligar a planilha</b>Abra a página principal do site para conectar.</div>';
      fitTela();
      return;
    }
    var useLocal = Q.get('modo') === 'local' || !conf.api;
    Store.mode = useLocal ? 'local' : 'sheet';
    Store.listeners.push(renderLive);
    if (useLocal) {
      Store.loadLocal();
      window.addEventListener('storage', function (e) { if (e.key === LOCAL_KEY) Store.poll(); });
      setInterval(function () { Store.poll(); }, 1500);
      return;
    }
    var tentar = function () {
      Store.load().then(function () {
        setInterval(function () { Store.poll(); }, Number(Q.get('intervalo')) * 1000 || 3000);
      }).catch(function () {
        $('.tela').innerHTML = '<div class="l-aviso"><b>Conectando à planilha</b>Tentando de novo em alguns segundos.</div>';
        fitTela();
        setTimeout(tentar, 5000);
      });
    };
    tentar();
  }

  function dtvLinhas(d) {

      return '<div class="dtv-l ' + (x.state === 'ganhou' ? 'w' : '') + '"><span class="tg num">' + x.tag + '</span><span class="nk">' + esc(x.nick) + '</span><span class="info">' + esc(info) + '</span>' +

      return d.rows.map(function (r) {

  function renderDTV() {

  function bootStatus() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var a = el.dataset.act;
      if (a === 'copiar') copy(el.dataset.txt);
      if (a === 'st-ligar') {
        var linhas = String(st.colar || '').split(/\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
        var url = linhas.filter(function (x) { return /script\.google(usercontent)?\.com/.test(x); })[0];
        var csvs = linhas.filter(function (x) { return /docs\.google\.com\/spreadsheets\/.+(output=csv|\/pub)/.test(x); });
        if (!url && !csvs.length) { toast('Cole o link /exec do leitor ou um link CSV publicado.', true); return; }
        LS.set('ac_fonte', url || ''); LS.set('ac_csv1', url ? '' : (csvs[0] || '')); LS.set('ac_csv2', url ? '' : (csvs[1] || ''));
        location.reload();
      }
      if (a === 'st-desligar') { ['ac_fonte', 'ac_csv1', 'ac_csv2'].forEach(LS.del); location.href = baseUrl(); }
    });
    document.addEventListener('input', function (e) { if (e.target.dataset.st === 'colar') st.colar = e.target.value; });
    document.addEventListener('change', function (e) {
      var k = e.target.dataset.st;
      if (!k || k === 'colar') return;
      st[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (k === 'tema') LS.set('ac_tema', st.tema);
      e.target.blur();
      renderStatus();
    });
    Store.listeners.push(renderStatus);
    var ultimo = '';
    Leitura.onTick = function () {
      document.querySelectorAll('[data-ago]').forEach(function (el) { el.setAttribute('data-ago', Leitura.lidoEm); });
      var k = Leitura.erro + '|' + !!Leitura.lidoEm;
      if (k !== ultimo) { ultimo = k; renderStatus(); }
    };
    renderStatus();
    if (Leitura.ativa()) Leitura.start();
  }

  /* ------------------------------------------------------------------ boot */
  document.documentElement.setAttribute('data-tema', Q.get('tema') === 'fluxo' ? 'fluxo' : 'bb');
  setInterval(tick, 1000);
  if (VIEW === 'live') bootLive();
  else if (VIEW === 'dtv') bootDTV();
  else if (VIEW === 'ops' && Q.get('modo') === 'local') bootOps();
  else bootStatus();

  window.__AC = { Store: Store, ui: ui, conf: conf };
})();

</script>
